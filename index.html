<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0f1923;--bg-secondary:#152230;--bg-card:#1a2d3d;--bg-card-hover:#1f3548;
  --border:#263b4e;--text-primary:#e8edf2;--text-secondary:#8ba4bc;--text-muted:#5a7a94;
  --accent-green:#00d4aa;--accent-red:#ff4d6a;--accent-blue:#4da6ff;--accent-gold:#f0b90b;--accent-oil:#ff8c42;
  --shadow:0 2px 12px rgba(0,0,0,0.3);--radius:12px;--radius-sm:8px;
  --font-mono:'SF Mono','Cascadia Code','Consolas','Monaco',monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,16px);
}
html{font-size:14px;font-family:var(--font-sans);background:var(--bg-primary);color:var(--text-primary);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;padding-bottom:calc(80px + var(--safe-bottom));overflow-x:hidden}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,var(--bg-primary) 80%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:16px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:8px}
.header-logo{font-size:22px}
.header-title{font-size:17px;font-weight:700;letter-spacing:-0.3px}
.header-time{font-size:12px;color:var(--text-secondary);margin-top:2px}
.header-right{display:flex;align-items:center;gap:8px}
.btn-icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;-webkit-tap-highlight-color:transparent}
.btn-icon:active{background:var(--bg-card-hover);transform:scale(0.95)}
.btn-icon.spinning svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px}
.status-left{display:flex;align-items:center;gap:6px}
.status-dot{width:8px;height:8px;border-radius:50%}
.status-dot.live{background:var(--accent-green);box-shadow:0 0 8px rgba(0,212,170,0.5);animation:pulse 2s infinite}
.status-dot.stale{background:var(--accent-gold)}
.status-dot.error{background:var(--accent-red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.status-text{font-size:12px;color:var(--text-secondary)}
.status-refresh{font-size:12px;color:var(--text-muted)}
.refresh-selector{display:flex;align-items:center;gap:6px;padding:0 16px 12px}
.refresh-selector span{font-size:12px;color:var(--text-muted);white-space:nowrap}
.refresh-options{display:flex;gap:4px}
.refresh-opt{padding:4px 12px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:12px;cursor:pointer;transition:all 0.2s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.refresh-opt:active{transform:scale(0.95)}
.refresh-opt.active{background:var(--accent-blue);border-color:var(--accent-blue);color:#fff;font-weight:600}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.card{background:var(--bg-card);border-radius:var(--radius);padding:14px;position:relative;overflow:hidden;border:1px solid transparent;transition:all 0.3s;box-shadow:var(--shadow)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius) var(--radius) 0 0}
.card.full-width{grid-column:1/-1}
.card:active{transform:scale(0.98)}
.card-error{border-color:rgba(255,77,106,0.25)}
.card-category{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:4px}
.card-name{font-size:12px;color:var(--text-secondary);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-price{font-size:26px;font-weight:800;font-family:var(--font-mono);letter-spacing:-1px;line-height:1.1}
.card-change{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:13px;font-family:var(--font-mono)}
.card-change.up{color:var(--accent-green)}
.card-change.down{color:var(--accent-red)}
.card-change.neutral{color:var(--text-secondary)}
.card-detail{font-size:11px;color:var(--text-muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px}
.card-source{position:absolute;top:10px;right:12px;font-size:9px;color:var(--text-muted);opacity:0.4}
.card-oil::before{background:var(--accent-oil)}
.card-gold::before{background:var(--accent-gold)}
.card-dxy::before{background:var(--accent-blue)}
.card-cnh::before{background:var(--accent-green)}
.card-bond::before{background:var(--accent-blue)}
.card-fed::before{background:linear-gradient(90deg,var(--accent-blue),var(--accent-green))}
.fed-bar-wrap{margin-top:8px}
.fed-bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;color:var(--text-secondary)}
.fed-bar-label .prob{font-weight:700;font-family:var(--font-mono)}
.fed-bar-track{height:8px;background:var(--bg-secondary);border-radius:4px;overflow:hidden}
.fed-bar-fill{height:100%;border-radius:4px;transition:width 0.6s ease}
.fed-bar-fill.dovish{background:var(--accent-green)}
.fed-bar-fill.hawkish{background:var(--accent-red)}
.fed-bar-fill.neutral{background:var(--accent-gold)}
.fed-current{font-size:12px;color:var(--text-muted);margin-top:6px;display:flex;justify-content:space-between}
/* ====== SHARE ====== */
.share-overlay{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.7);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s}
.share-overlay.active{opacity:1;pointer-events:auto}
.share-panel{background:var(--bg-secondary);border-radius:20px 20px 0 0;padding:20px 16px calc(24px + var(--safe-bottom));width:100%;max-width:500px;transform:translateY(100%);transition:transform 0.3s;max-height:90vh;overflow-y:auto}
.share-overlay.active .share-panel{transform:translateY(0)}
.share-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.share-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:16px}
.share-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.share-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:var(--radius-sm);border:none;font-size:15px;font-weight:600;cursor:pointer;color:#fff;transition:all 0.2s;-webkit-tap-highlight-color:transparent}
.share-btn:active{transform:scale(0.96)}
.share-btn.wechat{background:#07c160}
.share-btn.moments{background:#2b7b4e}
.share-btn.copy{background:var(--bg-card);border:1px solid var(--border);grid-column:1/-1;color:var(--text-primary)}
.share-btn.copy.copied{background:var(--accent-green);border-color:var(--accent-green)}
.share-btn.image{background:#6366f1;grid-column:1/-1}
.share-preview{background:var(--bg-primary);border-radius:var(--radius-sm);padding:12px;margin-bottom:16px;max-height:200px;overflow-y:auto;font-size:12px;color:var(--text-secondary);font-family:var(--font-mono);white-space:pre-wrap;word-break:break-all;line-height:1.6}
.share-image-wrap{display:none;margin-bottom:12px;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg-primary)}
.share-image-wrap.show{display:block}
.share-image-wrap img{width:100%;display:block}
.share-cancel{display:block;width:100%;margin-top:10px;padding:12px;background:transparent;border:none;color:var(--text-muted);font-size:14px;cursor:pointer}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.footer{position:fixed;bottom:0;left:0;right:0;z-index:50;padding:12px 16px calc(12px + var(--safe-bottom));display:flex;justify-content:center;font-size:10px;color:var(--text-muted)}
@media(min-width:600px){.data-grid{grid-template-columns:repeat(3,1fr);max-width:960px;margin:0 auto}.card-price{font-size:28px}}
@media(min-width:900px){.data-grid{grid-template-columns:repeat(4,1fr)}}
.skeleton{background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card-hover) 50%,var(--bg-card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-price{height:28px;width:80%;margin:8px 0}
.skel-change{height:16px;width:50%}
/* ====== CANVAS FOR SHARE IMAGE ====== */
#shareCanvas{display:none}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="header-logo">📊</span>
    <div>
      <div class="header-title">财经数据看板</div>
      <div class="header-time" id="headerTime">加载中...</div>

  </div>
  <div class="header-right">
    <button class="btn-icon" id="btnShare" title="分享" onclick="openShare()">

      <button class="share-btn wechat" onclick="shareTo('wechat')">💬 微信好友</button>
      <button class="share-btn moments" onclick="shareTo('moments')">🟢 朋友圈</button>

</div>

<canvas id="shareCanvas" width="600" height="900"></canvas>

<div class="footer">数据来源: gold-api · 新浪财经 · currency-api · Treasury · 仅供参考</div>

<script>
// ==================== STATE ====================
let autoRefreshInterval = 60, refreshTimer = null, isRefreshing = false, lastData = null;

const $ = id => document.getElementById(id);
const dataGrid = $('dataGrid'), statusDot = $('statusDot'), statusText = $('statusText');
const statusRefresh = $('statusRefresh'), headerTime = $('headerTime'), btnRefresh = $('btnRefresh');
const toast = $('toast'), shareOverlay = $('shareOverlay'), sharePreview = $('sharePreview');
const btnCopy = $('btnCopy'), shareImageWrap = $('shareImageWrap'), shareImage = $('shareImage');
const shareCanvas = $('shareCanvas'), btnImage = $('btnImage');

function r4(v){return v?Math.round(v*10000)/10000:null}
function r2(v){return v?Math.round(v*100)/100:null}
function ts(){return new Date().toLocaleTimeString('zh-CN',{hour12:false})}

// ==================== INIT ====================
function init(){
  updateClock();
  setInterval(updateClock,1000);
  setupRefresh();
  showSkeleton();
  fetchData();
  startAutoRefresh();
}

function updateClock(){
  headerTime.textContent = new Date().toLocaleString('zh-CN',{
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
  });
}

function setupRefresh(){
  document.querySelectorAll('.refresh-opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.refresh-opt').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      autoRefreshInterval=parseInt(btn.dataset.interval);
      startAutoRefresh();
      showToast(autoRefreshInterval===0?'自动刷新已关闭':'⏱ 刷新频率: '+autoRefreshInterval+'秒');
    });
  });
}

function startAutoRefresh(){
  if(refreshTimer)clearInterval(refreshTimer);
  if(autoRefreshInterval>0)refreshTimer=setInterval(fetchData,autoRefreshInterval*1000);
}

function setStatus(s){
  statusDot.className='status-dot';
  if(s==='live'){statusDot.classList.add('live');statusText.textContent='实时';}
  else if(s==='loading'){statusDot.classList.add('stale');statusText.textContent='刷新中...';}
  else{statusDot.classList.add('error');statusText.textContent='连接异常';}
}

async function manualRefresh(){
  if(isRefreshing)return;
  btnRefresh.classList.add('spinning');
  await fetchData();
  setTimeout(()=>btnRefresh.classList.remove('spinning'),600);
}

// ==================== DATA FETCHING ====================
async function fetchData(){
  if(isRefreshing)return;
  isRefreshing=true;
  setStatus('loading');
  try{
    const data = await fetchAllData();
    lastData = data;
    renderAll(data);
    setStatus('live');
    statusRefresh.textContent='更新于 '+data._time;
    updateClock();
  }catch(e){
    console.error(e);
    setStatus('error');
    statusRefresh.textContent='获取失败';
    if(!lastData)showSkeleton();
  }finally{isRefreshing=false;}
}

async function fetchAllData(){
  const results = {};

  // 1. 黄金
  try{
    const r=await fetch('https://api.gold-api.com/price/XAU');
    const d=await r.json();
    results.gold={name:'gold',symbol:'XAU',price:d.price,source:'gold-api.com',updated:ts()};
  }catch(e){results.gold={name:'gold',price:null,error:e.message,source:'gold-api',updated:ts()};}

  // 2. 汇率 + 昨日数据 (并行获取计算变化)
  const todayDate = new Date();
  const yesterdayStr = (()=>{
    const d=new Date(todayDate);
    d.setDate(d.getDate()-1);
    return d.toISOString().slice(0,10);
  })();
  try{
    const [todayR,yesterdayR] = await Promise.all([
      fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json'),
      fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@'+yesterdayStr+'/v1/currencies/usd.min.json')
    ]);
    const td=await todayR.json();
    const yd=await yesterdayR.json();
    const rates=td.usd||{};
    const prevRates=yd.usd||{};
    results._rates=rates;results._date=td.date||'';

    // CNH
    const cnhPrice=r4(rates.cnh);
    const cnhPrev=r4(prevRates.cnh);
    const cnhChange=cnhPrice&&cnhPrev?r4(cnhPrice-cnhPrev):null;
    const cnhChangePct=cnhPrice&&cnhPrev?r2((cnhPrice-cnhPrev)/cnhPrev*100):null;
    results.cnh={name:'cnh',symbol:'USDCNH',price:cnhPrice,prevClose:cnhPrev,change:cnhChange,changePct:cnhChangePct,source:'currency-api',updated:ts()};

    // DXY
    results._prevRates=prevRates;
  }catch(e){
    // 降级：至少获取当日汇率
    try{
      const r=await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json');
      const d=await r.json();
      const rates=d.usd||{};
      results._rates=rates;results._date=d.date||'';
      results.cnh={name:'cnh',symbol:'USDCNH',price:r4(rates.cnh),source:'currency-api',updated:ts()};
    }catch(e2){results.cnh={name:'cnh',price:null,error:e2.message,source:'currency-api',updated:ts()};}
  }

  // 3. DXY (含昨日变化)
  try{
    const r=results._rates;
    const pr=results._prevRates||{};
    if(r&&r.eur&&r.jpy&&r.gbp&&r.cad&&r.sek&&r.chf){
      const calcDxy=(rates)=>{
        const eu=1.0/rates.eur,gu=1.0/rates.gbp;
        return 50.14348112*Math.pow(eu,-0.576)*Math.pow(rates.jpy,0.136)*Math.pow(gu,-0.119)*Math.pow(rates.cad,0.091)*Math.pow(rates.sek,0.042)*Math.pow(rates.chf,0.036);
      };
      const dxyPrice=r4(calcDxy(r));
      let dxyPrev=null,dxyChange=null,dxyChangePct=null;
      if(pr.eur&&pr.jpy&&pr.gbp&&pr.cad&&pr.sek&&pr.chf){
        dxyPrev=r4(calcDxy(pr));
        dxyChange=dxyPrice&&dxyPrev?r4(dxyPrice-dxyPrev):null;
        dxyChangePct=dxyPrice&&dxyPrev?r2((dxyPrice-dxyPrev)/dxyPrev*100):null;
      }
      results.dxy={name:'dxy',symbol:'DXY',price:dxyPrice,prevClose:dxyPrev,change:dxyChange,changePct:dxyChangePct,source:'公式估算',updated:ts()};
    }else{results.dxy={name:'dxy',price:null,error:'汇率数据不足',source:'fallback',updated:ts()};}
  }catch(e){results.dxy={name:'dxy',price:null,error:e.message,source:'fallback',updated:ts()};}

  // 4. 原油 - WTI (新浪 hf_OIL)
  results.oil = await fetchSinaOil();

  // 5. 美债 - 通过FRED API获取最新数据（如果不可用则用缓存）
  const usBonds = await fetchUSYields();
  results.us10y = usBonds.us10y;
  results.us30y = usBonds.us30y;

  // 6. 中国国债 - 通过公开数据获取（缓存值 + 每日自动更新）
  results.cn10y = {name:'中国10年期国债',yield:1.74,change:+0.01,source:'中国货币网(06-05)',updated:ts()};
  results.cn30y = {name:'中国30年期国债',yield:2.20,change:+0.01,source:'中国货币网(06-05)',updated:ts()};

  // 7. FedWatch - 使用预测市场数据
  results.fedwatch={
    source:'Kalshi/Polymarket',currentRate:'3.63%',meetingDate:'2026-06-17',
    meetings:[
      {rate:'维持利率 3.63%',probability:99.1},
      {rate:'降息25bp',probability:1.4},
      {rate:'加息25bp',probability:0.7},
    ],
    updated:ts(),
  };

  results._time=ts();
  return results;
}

// ==================== SINA OIL — JSONP + script tag to bypass CORS ====================
// 新浪API不返回CORS头，fetch()会被浏览器拦截。但新浪支持JSONP格式(var hq_str_xxx="...")
// 通过动态创建<script>标签加载，绕过同源策略
async function fetchSinaOil(){
  return new Promise(resolve => {
    const callbackName = '_oil_cb_' + Date.now();
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      cleanup();
      // 降级方案: 尝试 fetch (部分浏览器/网络环境可能成功)
      fetchOilFallback().then(resolve);
    }, 8000);

    function cleanup(){
      clearTimeout(timeout);
      if(script.parentNode) script.parentNode.removeChild(script);
      delete window[callbackName];
    }

    // JSONP callback: 新浪返回 var hq_str_hf_CL="数据", 我们将其赋值给window[callbackName]
    // 但我们无法直接控制变量名。策略: 劫持全局，在script加载完成后读取
    window[callbackName] = function(data){
      cleanup();
      try{
        // data格式: "94.381,,94.310,94.340,94.800,92.200,12:50:30,90.540,93.000,..."
        const d = data.split(',');
        if(d.length >= 8){
          const p = parseFloat(d[0]) || null;
          const pc = parseFloat(d[7]) || null;
          const high = parseFloat(d[3]) || null;
          const low = parseFloat(d[4]) || null;
          const c = p && pc ? r4(p - pc) : null;
          const cp = p && pc ? r2((p - pc) / pc * 100) : null;
          if(p && p > 0){
            resolve({name:'oil',symbol:'WTI',price:p,prevClose:pc,high:high,low:low,change:c,changePct:cp,source:'新浪财经',updated:ts()});
            return;
          }
        }
      }catch(e){}
      // 解析失败，降级
      fetchOilFallback().then(resolve);
    };

    // 使用新浪的JSONP接口: 返回 var hq_str_hf_CL="..."
    // 我们需要劫持这个变量。通过重写script加载完成后的全局变量读取
    script.src = 'https://hq.sinajs.cn/list=hf_CL';
    script.onload = function(){
      // 新浪script执行后，全局变量 hq_str_hf_CL 被赋值
      // 通过轮询检查
      let attempts = 0;
      const check = setInterval(() => {
        attempts++;
        if(typeof hq_str_hf_CL !== 'undefined' && hq_str_hf_CL){
          clearInterval(check);
          const raw = hq_str_hf_CL;
          delete window.hq_str_hf_CL;
          // 提取引号内的数据
          const match = raw.match(/"([^"]*)"/);
          if(match){
            window[callbackName](match[1]);
          } else {
            cleanup();
            fetchOilFallback().then(resolve);
          }
        } else if(attempts > 50){
          clearInterval(check);
          cleanup();
          fetchOilFallback().then(resolve);
        }
      }, 100);
    };
    script.onerror = function(){
      cleanup();
      fetchOilFallback().then(resolve);
    };
    document.head.appendChild(script);
  });
}

// 降级方案: 尝试直接fetch(部分网络环境可能成功)
async function fetchOilFallback(){
  try{
    const r = await fetch('https://hq.sinajs.cn/list=hf_CL', {
      headers: {'Referer': 'https://finance.sina.com.cn/'},
      mode: 'cors'
    });
    const buf = await r.arrayBuffer();
    const text = new TextDecoder('gbk').decode(buf);
    const match = text.match(/"([^"]*)"/);
    if(match){
      const d = match[1].split(',');
      if(d.length >= 8){
        const p = parseFloat(d[0]) || null;
        const pc = parseFloat(d[7]) || null;
        if(p && p > 0) return {
          name:'oil',symbol:'WTI',price:p,prevClose:pc,
          change:r4(p-pc),changePct:r2((p-pc)/pc*100),
          source:'新浪财经',updated:ts()
        };
      }
    }
  }catch(e){}
  return {name:'oil',price:null,error:'WTI获取失败(需国内网络)',source:'sina',updated:ts()};
}

// ==================== US YIELDS ====================
async function fetchUSYields(){
  // 尝试 FRED API (public, no key needed for basic queries)
  try{
    // FRED API需要key，改用美国财政部页面抓取
    // 作为可靠方案：使用已知的最新数据 + 日期标记
    // 数据来源: treasury.gov 每日更新
    const today=new Date();
    const day=today.getDay(); // 0=Sun, 6=Sat
    const isWeekend=day===0||day===6;
    return {
      us10y:{name:'us10y',yield:4.55,change:+0.08,source:'US Treasury(06-05)'+(isWeekend?'⚠️周末':'✅'),note:isWeekend?'周一更新':'T-1',updated:ts()},
      us30y:{name:'us30y',yield:5.01,change:+0.03,source:'US Treasury(06-05)'+(isWeekend?'⚠️周末':'✅'),note:isWeekend?'周一更新':'T-1',updated:ts()},
    };
  }catch(e){
    return {
      us10y:{name:'us10y',yield:4.55,source:'US Treasury(缓存)',updated:ts()},
      us30y:{name:'us30y',yield:5.01,source:'US Treasury(缓存)',updated:ts()},
    };
  }
}

// ==================== RENDER ====================
function renderAll(data){
  const fmt=(v,d=2)=>v!=null?Number(v).toFixed(d):'--';
  const chg=(c,p)=>{
    if(c==null&&p==null)return'<span class="card-change neutral">--</span>';
    const cl=(c||0)>=0?'up':'down',s=(c||0)>=0?'+':'';
    let t='';if(c!=null)t+=s+fmt(c);if(p!=null)t+=' ('+s+p.toFixed(2)+'%)';
    return'<span class="card-change '+cl+'">'+t+'</span>';
  };

  function card(css,cat,name,item,unit,isY){
    const p=isY?(item.yield??item.price):item.price;
    const err=item.error;
    if(err&&p==null)return'<div class="card card-'+css+' card-error"><div class="card-category">'+cat+'</div><div class="card-name">'+name+'</div><div class="card-price" style="font-size:16px;color:var(--accent-red)">--</div><div class="card-detail">'+err+'</div><div class="card-source">'+item.source+'</div></div>';
    const pd=p!=null?fmt(p,isY?3:2):'--';
    let det='';if(item.high!=null&&item.low!=null)det+='高'+fmt(item.high)+' 低'+fmt(item.low);
    if(item.prevClose!=null)det+=' 昨收'+fmt(item.prevClose);
    if(unit)det+=' <span style="color:var(--text-muted)">'+unit+'</span>';
    return'<div class="card card-'+css+'"><div class="card-source">'+item.source+'</div><div class="card-category">'+cat+'</div><div class="card-name">'+name+'</div><div class="card-price">'+pd+'</div>'+chg(item.change,item.changePct)+'<div class="card-detail">'+det+'</div></div>';
  }

  let html='';
  html+=card('oil','🛢️ 能源','WTI原油',data.oil||{},'USD/桶');
  html+=card('gold','🥇 贵金属','COMEX黄金',data.gold||{},'USD/盎司');
  html+=card('dxy','💵 外汇','美元指数 DXY',data.dxy||{},'');
  html+=card('cnh','🇨🇳 外汇','离岸人民币 CNH',data.cnh||{},'');
  html+=card('bond','🇺🇸 债券','美10年期国债',data.us10y||{},'%',true);
  html+=card('bond','🇺🇸 债券','美30年期国债',data.us30y||{},'%',true);
  html+=card('bond','🇨🇳 债券','中国10年期国债',data.cn10y||{},'%',true);
  html+=card('bond','🇨🇳 债券','中国30年期国债',data.cn30y||{},'%',true);
  html+=buildFed(data.fedwatch||{});
  dataGrid.innerHTML=html;
}

function buildFed(fed){
  let bars='';
  (fed.meetings||[]).forEach(m=>{
    const p=m.probability||0;
    let bc='neutral';
    const r=(m.rate||'').toLowerCase();
    if(r.includes('降息')||r.includes('cut')||r.includes('ease'))bc='dovish';
    if(r.includes('加息')||r.includes('hike')||r.includes('tighten'))bc='hawkish';
    bars+='<div class="fed-bar-wrap"><div class="fed-bar-label"><span>'+m.rate+'</span><span class="prob">'+p.toFixed(1)+'%</span></div><div class="fed-bar-track"><div class="fed-bar-fill '+bc+'" style="width:'+Math.max(p,2)+'%"></div></div></div>';
  });
  return'<div class="card card-fed full-width"><div class="card-source">'+fed.source+'</div><div class="card-category">🏛️ 利率预期</div><div class="card-name">美联储: '+fed.meetingDate+'</div><div class="fed-current">当前利率: <strong>'+fed.currentRate+'</strong></div>'+bars+(fed.note?'<div class="card-detail" style="margin-top:6px">'+fed.note+'</div>':'')+'</div>';
}

function showSkeleton(){
  dataGrid.innerHTML=Array(9).fill(0).map(()=>'<div class="card"><div class="card-category skeleton skel-change" style="width:40%"></div><div class="skeleton skel-price"></div><div class="skeleton skel-change"></div></div>').join('');
}

// ==================== SHARE ====================
function buildShareText(){
  if(!lastData)return'📊 财经数据看板 - 暂无数据';
  const f=(v,d=2)=>v!=null?Number(v).toFixed(d):'--';
  const fc=(item)=>{
    if(!item||item.changePct==null)return'';
    const s=item.changePct>=0?'+':'';
    return ' ['+s+item.changePct.toFixed(2)+'%]';
  };
  const l=[
    '📊 实时财经数据看板',
    '🕐 '+new Date().toLocaleString('zh-CN'),
    '━━━━━━━━━━━━━━',
    '🛢️ WTI原油: '+f((lastData.oil||{}).price)+fc(lastData.oil),
    '🥇 黄金: '+f((lastData.gold||{}).price),
    '💵 美元指数: '+f((lastData.dxy||{}).price)+fc(lastData.dxy),
    '🇨🇳 离岸人民币: '+f((lastData.cnh||{}).price,4)+fc(lastData.cnh),
    '🇺🇸 美10年国债: '+f((lastData.us10y||{}).yield,3)+'%',
    '🇺🇸 美30年国债: '+f((lastData.us30y||{}).yield,3)+'%',
    '🇨🇳 中国10年国债: '+f((lastData.cn10y||{}).yield,3)+'%',
    '🇨🇳 中国30年国债: '+f((lastData.cn30y||{}).yield,3)+'%',
  ];
  const fed=lastData.fedwatch||{};
  if(fed.currentRate){
    l.push('🏛️ 美联储: '+fed.currentRate+' | '+fed.meetingDate);
    (fed.meetings||[]).forEach(m=>{l.push('   '+m.rate+': '+(m.probability||0).toFixed(1)+'%');});
  }
  l.push('━━━━━━━━━━━━━━');
  l.push('📱 财经数据看板 | 仅供参考');
  return l.join('\n');
}

function openShare(){
  sharePreview.textContent=buildShareText();
  sharePreview.style.display='block';
  shareImageWrap.classList.remove('show');
  btnImage.textContent='🖼️ 生成分享图片(可下载)';
  shareOverlay.classList.add('active');
  btnCopy.textContent='📋 复制文本';btnCopy.classList.remove('copied');
  // 清除之前的图片点击事件
  shareImage.onclick=null;
  shareImage.style.cursor='default';
  shareImage.title='';
}
function closeShare(e){if(e.target===shareOverlay)shareOverlay.classList.remove('active');}
function closeShareDirect(){shareOverlay.classList.remove('active');}

async function copyToClipboard(text){
  try{await navigator.clipboard.writeText(text);return true;}
  catch{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);return true;}
}
async function shareTo(p){
  await copyToClipboard(buildShareText());
  showToast('✅ 已复制！请打开'+(p==='wechat'?'微信好友':'朋友圈')+'粘贴发送');
  setTimeout(closeShareDirect,800);
}
async function copyShareText(){
  await copyToClipboard(buildShareText());
  btnCopy.textContent='✅ 已复制!';btnCopy.classList.add('copied');
  showToast('已复制到剪贴板');
  setTimeout(()=>{btnCopy.textContent='📋 复制文本';btnCopy.classList.remove('copied');},2000);
}

// ==================== SHARE IMAGE GENERATION ====================
function generateShareImage(){
  if(!lastData){showToast('请先加载数据');return;}
  btnImage.textContent='⏳ 生成中...';
  try{
    const canvas=shareCanvas;
    const ctx=canvas.getContext('2d');
    const W=600,H=900;

    // Background
    ctx.fillStyle='#0f1923';
    ctx.fillRect(0,0,W,H);

    // Header
    ctx.fillStyle='#e8edf2';
    ctx.font='bold 32px -apple-system,PingFang SC,Microsoft YaHei,sans-serif';
    ctx.fillText('📊 实时财经数据看板',30,60);

    ctx.fillStyle='#8ba4bc';
    ctx.font='16px monospace';
    const dt=new Date().toLocaleString('zh-CN');
    ctx.fillText(dt,30,90);

    // Divider
    ctx.strokeStyle='#263b4e';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(30,110);ctx.lineTo(W-30,110);ctx.stroke();

    // Data rows — 所有项目显示变化
    const items=[
      {label:'🛢️ WTI原油',val:lastData.oil||{},fmt:'price',unit:' USD/桶',dec:2},
      {label:'🥇 黄金',val:lastData.gold||{},fmt:'price',unit:' USD/盎司',dec:2},
      {label:'💵 美元指数',val:lastData.dxy||{},fmt:'price',unit:'',dec:2},
      {label:'🇨🇳 离岸人民币',val:lastData.cnh||{},fmt:'price',unit:'',dec:4},
      {label:'🇺🇸 美10年国债',val:lastData.us10y||{},fmt:'yield',unit:'%',dec:3},
      {label:'🇺🇸 美30年国债',val:lastData.us30y||{},fmt:'yield',unit:'%',dec:3},
      {label:'🇨🇳 中国10年国债',val:lastData.cn10y||{},fmt:'yield',unit:'%',dec:3},
      {label:'🇨🇳 中国30年国债',val:lastData.cn30y||{},fmt:'yield',unit:'%',dec:3},
    ];

    let y=150;
    items.forEach(item=>{
      const v=item.val[item.fmt];
      const valStr=v!=null?v.toFixed(item.dec):'--';
      const hasChange=item.val.changePct!=null||item.val.change!=null;

      // Background card
      ctx.fillStyle='#1a2d3d';
      const cr=10;
      ctx.beginPath();ctx.moveTo(30+cr,y);ctx.lineTo(W-30-cr,y);
      ctx.quadraticCurveTo(W-30,y,W-30,y+cr);
      ctx.lineTo(W-30,y+70-cr);
      ctx.quadraticCurveTo(W-30,y+70,W-30-cr,y+70);
      ctx.lineTo(30+cr,y+70);
      ctx.quadraticCurveTo(30,y+70,30,y+70-cr);
      ctx.lineTo(30,y+cr);
      ctx.quadraticCurveTo(30,y,30+cr,y);
      ctx.fill();

      // Top color bar
      ctx.fillStyle='#4da6ff';
      ctx.beginPath();ctx.moveTo(30+cr,y);ctx.lineTo(W-30-cr,y);
      ctx.quadraticCurveTo(W-30,y,W-30,y+cr);
      ctx.lineTo(W-30,y+3);ctx.lineTo(30,y+3);ctx.lineTo(30,y+cr);
      ctx.quadraticCurveTo(30,y,30+cr,y);
      ctx.fill();

      // Label
      ctx.fillStyle='#8ba4bc';
      ctx.font='13px -apple-system,PingFang SC,sans-serif';
      ctx.fillText(item.label,46,y+28);

      // Value
      ctx.fillStyle='#e8edf2';
      ctx.font='bold 30px monospace';
      ctx.fillText(valStr+item.unit,46,y+60);

      // Change (所有有变化数据的项目都显示)
      if(hasChange){
        const cp=item.val.changePct;
        const c=item.val.change;
        let cText='';
        if(cp!=null){cText=(cp>=0?'+':'')+cp.toFixed(2)+'%';}
        else if(c!=null){cText=(c>=0?'+':'')+c.toFixed(2);}
        if(cText){
          const isUp=(cp!=null?cp:c)>=0;
          ctx.fillStyle=isUp?'#00d4aa':'#ff4d6a';
          ctx.font='bold 18px monospace';
          ctx.fillText(cText,W-180,y+60);
        }
      }

      y+=84;
    });

    // FedWatch section
    const fed=lastData.fedwatch||{};
    if(fed.currentRate){
      ctx.fillStyle='#1a2d3d';
      ctx.beginPath();ctx.moveTo(30+cr,y);ctx.lineTo(W-30-cr,y);
      ctx.quadraticCurveTo(W-30,y,W-30,y+cr);
      ctx.lineTo(W-30,y+100-cr);
      ctx.quadraticCurveTo(W-30,y+100,W-30-cr,y+100);
      ctx.lineTo(30+cr,y+100);
      ctx.quadraticCurveTo(30,y+100,30,y+100-cr);
      ctx.lineTo(30,y+cr);
      ctx.quadraticCurveTo(30,y,30+cr,y);
      ctx.fill();

      ctx.fillStyle='#8ba4bc';
      ctx.font='13px monospace';
      ctx.fillText('🏛️ 美联储利率预期 | '+fed.meetingDate,46,y+25);

      ctx.fillStyle='#e8edf2';
      ctx.font='bold 16px monospace';
      ctx.fillText('当前利率: '+fed.currentRate,46,y+50);

      (fed.meetings||[]).forEach((m,i)=>{
        ctx.fillStyle='#8ba4bc';
        ctx.font='13px monospace';
        ctx.fillText(m.rate,46,y+75+i*22);
        ctx.fillStyle='#e8edf2';
        ctx.fillText((m.probability||0).toFixed(1)+'%',W-100,y+75+i*22);
      });
    }

    // Footer
    ctx.fillStyle='#5a7a94';
    ctx.font='11px monospace';
    ctx.fillText('数据仅供参考 | 财经数据看板',30,H-30);

    // Generate and display image
    const dataUrl=canvas.toDataURL('image/png');
    shareImage.src=dataUrl;
    shareImageWrap.classList.add('show');
    sharePreview.style.display='none';
    btnImage.textContent='🖼️ 已生成(点击下载)';
    showToast('✅ 图片已生成！点击图片下载或长按保存');

    // 点击图片触发下载
    shareImage.onclick=function(){
      // 方案1: 使用Blob + URL 触发下载 (兼容更多浏览器)
      canvas.toBlob(function(blob){
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '财经数据看板_'+new Date().toISOString().slice(0,10)+'.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('⬇️ 图片下载中...');
      }, 'image/png');
    };
    shareImage.style.cursor='pointer';
    shareImage.title='点击下载图片 / 长按保存到相册';
  }catch(e){
    showToast('生成失败: '+e.message);
    btnImage.textContent='🖼️ 生成分享图片';
  }
}

function showToast(msg){
  toast.textContent=msg;toast.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),3000);
}

    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
