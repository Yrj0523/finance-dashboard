name: Update Oil Price

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch oil price from Sina
        run: |
          python3 << 'PYEOF'
          import subprocess, json, re
          from datetime import datetime

          def fetch(code):
              r = subprocess.run(['curl', '-s', '-H', 'Referer: https://finance.sina.com.cn/',
                  f'https://hq.sinajs.cn/list={code}'], capture_output=True)
              text = r.stdout.decode('gbk', errors='replace')
              m = re.search(r'"([^"]*)"', text)
              if m:
                  d = m.group(1).split(',')
                  if len(d) >= 8 and d[0] and d[7]:
                      return {
                          'price': float(d[0]),
                          'prevClose': float(d[7]),
                          'high': float(d[3]) if d[3] else None,
                          'low': float(d[4]) if d[4] else None
                      }
              return None

          wti = fetch('hf_CL')
          brent = fetch('hf_OIL')

          data = {
              'updated': datetime.now().strftime('%Y-%m-%d %H:%M:%S'),
              'source': '新浪财经',
              'wti': wti,
              'brent': brent
          }

          with open('oil.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print('WTI:', wti)
          print('Brent:', brent)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oil.json
          git diff --staged --quiet || git commit -m "Update oil price [skip ci]"
          git push
