name: Update Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch oil price from Sina
        run: |
          python3 << 'PYEOF'
          import subprocess, json, re
          from datetime import datetime

          def fetch(code):
              r = subprocess.run(['curl', '-s', '-H', 'Referer: https://finance.sina.com.cn/',
                  f'https://hq.sinajs.cn/list={code}'], capture_output=True)
              text = r.stdout.decode('gbk', errors='replace')
              m = re.search(r'"([^"]*)"', text)
              if m:
                  d = m.group(1).split(',')
                  if len(d) >= 8 and d[0] and d[7]:
                      return {
                          'price': float(d[0]),
                          'prevClose': float(d[7]),
                          'high': float(d[3]) if d[3] else None,
                          'low': float(d[4]) if d[4] else None
                      }
              return None

          wti = fetch('hf_CL')
          brent = fetch('hf_OIL')

          data = {
              'updated': datetime.now().strftime('%Y-%m-%d %H:%M:%S'),
              'source': '新浪财经',
              'wti': wti,
              'brent': brent
          }

          with open('oil.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print('WTI:', wti)
          print('Brent:', brent)
          PYEOF

      - name: Fetch bond yields (US Treasury + China)
        run: |
          python3 << 'PYEOF'
          import subprocess, json, csv, io, re
          from datetime import datetime, timezone, timedelta

          bonds = {'updated': datetime.now().strftime('%Y-%m-%d %H:%M:%S')}

          # ========== US Treasury Yields (CSV from treasury.gov) ==========
          try:
              r = subprocess.run(['curl', '-s', '-L',
                  'https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_yield_curve&field_tdr_date_value=2026&page&_format=csv'],
                  capture_output=True, timeout=30)
              text = r.stdout.decode('utf-8', errors='replace')
              reader = csv.DictReader(io.StringIO(text))
              rows = list(reader)
              if rows:
                  # CSV is descending (latest first): rows[0] = newest
                  last = rows[0]
                  date_str = last.get('Date', '').strip()
                  us10y = last.get('10 Yr', '').strip()
                  us30y = last.get('30 Yr', '').strip()
                  if us10y and us30y:
                      bonds['us10y'] = {'yield': float(us10y), 'date': date_str}
                      bonds['us30y'] = {'yield': float(us30y), 'date': date_str}
                      print(f"US 10Y: {us10y}%, US 30Y: {us30y}% (date: {date_str})")
                  # Get previous day for change calculation (rows[1])
                  if len(rows) >= 2:
                      prev = rows[1]
                      p10 = prev.get('10 Yr', '').strip()
                      p30 = prev.get('30 Yr', '').strip()
                      if p10: bonds['us10y']['prev'] = float(p10)
                      if p30: bonds['us30y']['prev'] = float(p30)
          except Exception as e:
              print(f'US Treasury fetch error: {e}')

          # ========== China Bond Yields (chinabond.com.cn) ==========
          try:
              r = subprocess.run(['curl', '-s', '-H', 'User-Agent: Mozilla/5.0',
                  'https://yield.chinabond.com.cn/cbweb-czb-web/czb/moreInfo?locale=en_US&nameType=1'],
                  capture_output=True, timeout=30)
              html = r.stdout.decode('utf-8', errors='replace')

              # Parse table: <td>10Yr</td> ... <td>VALUE</td>
              cn10y_match = re.search(r'<td>10Yr</td>\s*<td>(\d+\.\d+)</td>', html)
              cn30y_match = re.search(r'<td>30Yr</td>\s*<td>(\d+\.\d+)</td>', html)

              tz = timezone(timedelta(hours=8))
              today = datetime.now(tz).strftime('%Y-%m-%d')

              if cn10y_match and cn30y_match:
                  bonds['cn10y'] = {'yield': float(cn10y_match.group(1)), 'date': today}
                  bonds['cn30y'] = {'yield': float(cn30y_match.group(1)), 'date': today}
                  print(f"CN 10Y: {cn10y_match.group(1)}%, CN 30Y: {cn30y_match.group(1)}%")
              else:
                  print(f"CN bond parse failed: 10Y={cn10y_match is not None}, 30Y={cn30y_match is not None}")
                  bonds['cn10y'] = {'yield': 1.74, 'date': today, 'note': 'fallback'}
                  bonds['cn30y'] = {'yield': 2.22, 'date': today, 'note': 'fallback'}
          except Exception as e:
              print(f'China bond fetch error: {e}')
              tz = timezone(timedelta(hours=8))
              today = datetime.now(tz).strftime('%Y-%m-%d')
              bonds['cn10y'] = {'yield': 1.74, 'date': today, 'note': 'error'}
              bonds['cn30y'] = {'yield': 2.22, 'date': today, 'note': 'error'}

          with open('bonds.json', 'w', encoding='utf-8') as f:
              json.dump(bonds, f, indent=2, ensure_ascii=False)

          print('Bonds updated:', json.dumps(bonds, indent=2))
          PYEOF

      - name: Fetch FedWatch probabilities
        run: |
          python3 << 'PYEOF'
          import subprocess, json, re
          from datetime import datetime, timezone, timedelta

          fed = {'updated': datetime.now().strftime('%Y-%m-%d %H:%M:%S')}
          tz = timezone(timedelta(hours=8))

          # ========== 方案1: CME FedWatch API ==========
          try:
              r = subprocess.run(['curl', '-s', '--max-time', '15',
                  'https://markets.api.cmegroup.com/fedwatch/v1/forecasts',
                  '-H', 'Accept: application/json'], capture_output=True, timeout=20)
              text = r.stdout.decode('utf-8', errors='replace')
              if text and text.strip().startswith('{'):
                  data = json.loads(text)
                  # Parse CME API response
                  forecasts = data.get('forecastDatas', data.get('data', []))
                  if not forecasts and isinstance(data, list):
                      forecasts = data
                  if forecasts:
                      f0 = forecasts[0] if isinstance(forecasts, list) else forecasts
                      # Extract probabilities
                      probs = f0.get('probabilities', f0.get('forecast', {}))
                      if probs:
                          fed['source'] = 'CME FedWatch API'
                          fed['meetingDate'] = f0.get('meetingDate', '')
                          fed['currentRate'] = '3.50%-3.75%'
                          meetings = []
                          for k, v in probs.items():
                              meetings.append({'rate': k, 'probability': float(v)})
                          fed['meetings'] = meetings
                          print(f"CME API success: {json.dumps(fed, indent=2)}")
              if 'meetings' not in fed:
                  raise Exception('CME API response unparseable')
          except Exception as e:
              print(f'CME API failed: {e}')

              # ========== 方案2: growbeansprout.com ==========
              try:
                  r = subprocess.run(['curl', '-s', '--max-time', '15',
                      '-H', 'User-Agent: Mozilla/5.0',
                      'https://growbeansprout.com/tools/fedwatch'],
                      capture_output=True, timeout=20)
                  html = r.stdout.decode('utf-8', errors='replace')

                  # Extract hold probability
                  hold_match = re.search(r'(\d+\.?\d*)%\s*probability.*?(?:maintain|hold)', html, re.IGNORECASE)
                  if not hold_match:
                      hold_match = re.search(r'probability.*?(\d+\.?\d*)%', html, re.IGNORECASE)

                  # Extract meeting date
                  date_match = re.search(r'(\d{1,2}\s+\w{3}\s+\d{4})', html)

                  # Extract current rate range (e.g. "3.50% to 3.75%")
                  rate_match = re.search(r'(\d+\.\d+)\s*%\s*to\s*(\d+\.\d+)\s*%', html)

                  if hold_match:
                      hold_pct = float(hold_match.group(1))
                      # Determine hike vs cut from context
                      # If hold > 50%, remaining is likely hike (in current hawkish environment)
                      # Check for hike/cut keywords
                      has_hike = bool(re.search(r'hike|raise|increase', html, re.IGNORECASE))
                      has_cut = bool(re.search(r'cut|lower|decrease|reduce', html, re.IGNORECASE))

                      remaining = round(100 - hold_pct, 1)

                      # Current environment: inflation high, rate hike expected
                      # Default: remaining goes to hike
                      hike_pct = remaining
                      cut_pct = 0.0

                      fed['source'] = 'growbeansprout.com'
                      fed['meetingDate'] = date_match.group(1) if date_match else ''
                      cur_rate = f'{rate_match.group(1)}%-{rate_match.group(2)}%' if rate_match else '3.50%-3.75%'
                      fed['currentRate'] = cur_rate
                      fed['meetings'] = [
                          {'rate': f'维持利率 {cur_rate}', 'probability': hold_pct},
                          {'rate': '加息25bp', 'probability': hike_pct},
                          {'rate': '降息25bp', 'probability': cut_pct},
                      ]
                      print(f"Growbeansprout success: hold={hold_pct}%, hike={hike_pct}%")
                  else:
                      raise Exception('Could not parse growbeansprout')
              except Exception as e2:
                  print(f'Growbeansprout failed: {e2}')

                  # ========== 方案3: 缓存值 ==========
                  today = datetime.now(tz).strftime('%Y-%m-%d')
                  fed['source'] = '缓存数据'
                  fed['meetingDate'] = '2026-07-29'
                  fed['currentRate'] = '3.50%-3.75%'
                  fed['meetings'] = [
                      {'rate': '维持利率 3.50%-3.75%', 'probability': 70.1},
                      {'rate': '加息25bp', 'probability': 29.9},
                      {'rate': '降息25bp', 'probability': 0.0},
                  ]
                  fed['note'] = 'fallback cache'
                  print('Using fallback cache data')

          with open('fedwatch.json', 'w', encoding='utf-8') as f:
              json.dump(fed, f, indent=2, ensure_ascii=False)

          print('FedWatch:', json.dumps(fed, indent=2, ensure_ascii=False))
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oil.json bonds.json fedwatch.json
          git diff --staged --quiet || git commit -m "Update data [skip ci]"
          git push
